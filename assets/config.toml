[moods]

# Mood-to-color anchors live in this file. Generate it by calling `feeling :moods`.
# source = "moods.toml"

# Instruction prefix for embedding model
prefix_string = "Emotional state: "
# A neutral phrase standing for "no particular mood"; anchor colors are measured from this baseline.
base_string = "Emotional state"

# How decisively the strongest anchor mood wins the final color (1.0 = even mix, higher = dominant).
blend_steepness = 2.0

# How much emotional intensity (saliency) moves a color away from neutral:
# 0 disables it entirely, 100 keeps the full effect.
effective_saliency_gate = 50

# Neutral gray lightness (0-100) used when no anchor mood matches, default 65.
baseline_oklab_l = 65

# An anchor mood must make up at least this % of the color mix to be included at all.
# min_contribution = 7
# top_k = 5

[tasks]
# colors = ["dark_red", "dark_yellow", "dark_green"]
# default_priority = 5             # 1..=999
# default_recurring_priority = 10
# default_scheduled_priority = 15

[grid]
# week_rolling = false
# month_rolling = true
# year_rolling = true
# week_start = "Monday"

[preview]
# Show a `last:` field for done tasks in the preview pane.
show_last_when_done = true

[today_view]
# include_overdue = false

# Merge a task's adjacent completion entries into a single done row
# in the today view.
coalesce_completions = true

[tasks_view]
# Keep a just-completed task visible in the pending view (@) for this many
# seconds after its last completion entry.
persist_pending_seconds = 300

[date]
# uk | us — chrono-english dialect for date parsing. Only affects ambiguous
# slash forms like "3/5/2024" (uk = 5 March, us = March 5); ISO dates and
# relative phrases ("yesterday", "3 days ago") are unaffected.
dialect = "uk"

[editor]
# Display a hint at the top of the editor when writing entry bodies.
hint = true

