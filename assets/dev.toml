[moods]
# Mood-to-color anchors live in the file named by `source` (relative to the
# config directory); see assets/moods.dev.toml for the bundled default set.
source = "moods.dev.toml"

prefix_string = "person says: "
# A neutral phrase standing for "no particular mood"; anchor colors are measured from this baseline.
base_string = "this person feels:"

# How decisively the strongest anchor mood wins the final color (1.0 = even mix, higher = dominant).
blend_steepness = 2.0

# How much emotional intensity (saliency) moves a color away from neutral:
# 0 disables it entirely, 100 keeps the full effect. Default 50.
effective_saliency_gate = 80

# Neutral gray lightness (0-100) used when no anchor mood matches, default 65.
baseline_oklab_l = 65

# An anchor mood must make up at least this % of the color mix to be included at all.
# min_contribution = 7
# top_k = 5

[tasks]
colors = ["dark_red", "dark_yellow", "dark_green"]
default_priority = 5                               # 1..=999
default_recurring_priority = 5                     # 1..=999 (recurring tasks)
default_scheduled_priority = 10                    # 1..=999 (scheduled tasks)

[grid]
week_rolling = false
month_rolling = true
year_rolling = true
week_start = "Monday"

[preview]
# Show a `last:` field for done tasks in the preview pane.
show_last_when_done = true

[today_view]
include_overdue = false
# Merge a task's adjacent completion entries into a single done row
# in the today view (accepted for future use; no behavior yet).
coalesce_completions = false

[tasks_view]
# Keep a just-completed task visible in the pending view (@) for this many
# seconds after its last completion entry.
persist_pending_seconds = 300

[tracker]
# populatable as: [tracker.<name>]
# interval = ["2020-01-01T00:00:00-04:00", "1 day"]   # anchor datetime + calendar span
# kind = "float"      # text | number | float | null
# min = 0
# max = 10

[tracker.sleep]
interval = ["2020-01-01T00:00:00-04:00", "1 day"]
kind = "float"
min = 0
max = 10

[tracker.run_times]
interval = ["2020-01-01T00:00:00-04:00", "1 week"]
kind = "float"
min = 100
max = 0

# Interval trackers without min/max — binning falls back to last color
[tracker.water]
interval = ["2020-01-01T00:00:00-04:00", "1 day"]
kind = "float"

# Interval text tracker — entries stored as strings, no numeric binning
[tracker.notes]
interval = ["2020-01-01T00:00:00-04:00", "1 week"]
kind = "text"

# Non-interval number tracker with only min (no max — bins from min upward).
[tracker.steps]
kind = "number"
min = 0

[tracker.mood_notes]
kind = "text"

# Tracker with values spanning below min, in range, and above max
# to exercise the full color binning palette.
[tracker.temperature]
interval = ["2020-01-01T00:00:00-04:00", "1 day"]
kind = "number"
min = 10
max = 30
[editor]
# Write the "# additional notes below" hint line as the first line of the
# body editor (feeling .. / feeling ! name ..). When disabled the temp file
# starts empty and your first line is kept verbatim.
hint = true
