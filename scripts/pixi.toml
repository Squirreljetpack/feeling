[workspace]
name = "feeling-scripts"
version = "0.1.0"
description = "Pixi-managed Python environment for feeling's embedding pipeline: train a small saliency adaptor (MLP head) on frozen base bge-small-en-v1.5 embeddings, score mood texts via embed_regression.py, and re-derive the quantized base ONNX asset (assets/model/bge_small.onnx) with quantize_qdq.py."
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
# Full flow: train adaptor on train.csv (and export ONNX for the Rust runtime) -> regression sanity check -> quantize base asset:
train_adaptor = "python train_adaptor.py --export-onnx"
regression = "python embed_regression.py"
quantize = "python quantize_qdq.py"

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pip = "*"
onnxruntime = "*"

[pypi-dependencies]
# onnx is used by quantize_qdq.py to inspect/rewrite the QDQ graph; tokenizers
# for tokenization in embed_regression.py / train_adaptor.py; torch powers the
# adaptor MLP (adaptor.py). No transformers/sentence-transformers needed: the
# base model is consumed directly via onnxruntime.
tokenizers = "*"
onnx = "*"
torch = "*"
